# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Quartz 5
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: en-US
  baseUrl: quartz.jzhao.xyz
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#284b63"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#fff23688"
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#7b97aa"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#b3aa0288"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: tokyo-night
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50
  # 本地 graph-pro（fork quartz-community/graph）：构建期预计算 + 图谱 UI（局部/全局）。
  # d3@7 / pixi.js@8 已随插件打包（不再走 jsdelivr CDN）。
  # 首屏与分组（2026-09-26 简化）：邻居分组复用 configuration.aggregation，首屏大区恒为文件夹，
  # 核心节点 = folders 白名单命中者；regionRules / aggregation / coreNodeFilter 已删除（由图内解析层合成）。
  - source: ../plugins-local/graph-pro
    enabled: true
    options: &graph-pro-options
      graph:
        precomputeLocal: true
        localDepth: 1
      localGraph:
        # 邻居分组统一复用 configuration.aggregation；不再写 localGraph.aggregation
        drag: true
        zoom: true
        depth: 1
        scale: 1.1
        repelForce: 0.6
        centerForce: 0.3
        linkDistance: 70
        fontSize: 0.75
        opacityScale: 1
        showTags: true
        removeTags: []
        focusOnHover: false
        enableRadial: false
      globalGraph:
        enabled: true
        folders: [项目]
        expandCoresOnRegionOpen: false
        coreNodeLimit: 50
        countLabelMin: 7
        countLabelMaxDisplay: 120
        startCollapsed: true
        filterOrphans: true
        filterNonCoreNodes: true
        drag: true
        zoom: true
        depth: -1
        scale: 0.9
        repelForce: 1.5
        centerForce: 0.4
        linkDistance: 150
        fontSize: 0.72
        opacityScale: 1
        showTags: true
        removeTags: []
        focusOnHover: true
        enableRadial: true
    order: 55
    layout:
      position: right
      priority: 10
      component: Graph
  - source: ../plugins-local/graph-pro
    enabled: true
    options: *graph-pro-options
    order: 56
    layout:
      position: header
      priority: 30
      component: GlobalGraphOverlay
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/jackyzha0/quartz
        Discord Community: https://discord.gg/cRFFHYye7t
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  # 本地 note-properties-pro（fork quartz-community/note-properties）：frontmatter 值支持 HTML 锚点渲染
  # + 附件链接自动挂 download。属性显示链（2026-09-26，与 configuration.aggregation 同构）：
  # 链 = 有序白名单，按目录决定面板显示哪些字段；链外字段仍可参与聚合维度（即「只聚合、不显示」）。
  - source: ../plugins-local/note-properties-pro
    enabled: true
    options:
      includeAll: false
      includedProperties: [description, tags, aliases]
      # 全局兜底：title 不在面板显示（避免与页面标题重复）
      excludedProperties: [title]
      properties:
        folderDepth: 1
        branches:
          default: [date, type, status, priority, category, tags]
          folders:
            项目: [阶段, type, status, 负责人, tags]
            任务: [status, 阶段, 级别, 负责人, tags]
            人员: [category, type, 级别, 组织, tags]
            组织: [type, 阶段, tags]
            问答: [category, status, tags]
      hidePropertiesView: false
      delimiters: ---
      language: yaml
      htmlInProperties: true
      downloadAttachments: true
      attachmentExtensions: []
      downloadNameFrom: alias
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}

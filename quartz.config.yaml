# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: 源悦知识库
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: zh-CN
  baseUrl: localhost/demo-region
  defaultDateType: modified
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: local
    cdnCaching: false
    typography:
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#ffffff"
        lightgray: "#dce3ec"
        gray: "#64748b"
        darkgray: "#334155"
        dark: "#0f172a"
        secondary: "#0369a1"
        tertiary: "#0891b2"
        highlight: rgba(3, 105, 161, 0.1)
        textHighlight: "#fef3c7aa"
      darkMode:
        light: "#0b1220"
        lightgray: "#243244"
        gray: "#7c8ba1"
        darkgray: "#cbd5e1"
        dark: "#f1f5f9"
        secondary: "#38bdf8"
        tertiary: "#22d3ee"
        highlight: rgba(56, 189, 248, 0.15)
        textHighlight: "#fef3c788"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
      # 关闭 mermaid：其脚本从 cdnjs.cloudflare.com 懒加载（obsidian-flavored-markdown
      # 的 src/scripts/mermaid.inline.ts:195），站点要求零外链；当前内容也没有 mermaid 图。
      # 将来需要时按铁律 fork 该插件，参考 v4 的 client/quartz/static/mermaid/（ESM 入口 + chunks 分片）
      mermaid: false
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/hard-line-breaks
    enabled: true
    order: 50
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 60
  # 社区版 crawl-links 已由本地 crawl-links-pro 替代（正文附件链接自动挂 download + data-router-ignore）
  - source: github:quartz-community/crawl-links
    enabled: false
    options:
      markdownLinkResolution: shortest
    order: 70
  - source: ../plugins-local/crawl-links-pro
    enabled: true
    options:
      markdownLinkResolution: shortest
      # 新增能力（默认即开启，显式写出便于调整）
      downloadAttachments: true
      attachmentExtensions: []
      downloadNameFrom: alias
      # 附件（资源文件）不计入页面出链 → 不再被当成"被引用但不存在的页面"，
      # 因此不会生成虚拟节点占位页，也不会出现在图谱 / 目录树 / 搜索里
      excludeAttachmentsFromLinks: true
    order: 70
  - source: github:quartz-community/description
    enabled: true
    order: 80
  - source: github:quartz-community/latex
    enabled: false
    order: 90
  - source: github:quartz-community/citations
    enabled: false
    order: 95
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: false
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: false
  - source: github:quartz-community/og-image
    enabled: false
  - source: github:quartz-community/cname
    enabled: false
  - source: github:quartz-community/canvas-page
    enabled: false
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/bases-page
    enabled: false
  # 本地虚拟节点占位页（v4 `VirtualNodePage` 迁移）：pageType 插件，
  # 用 generate() 为「被引用但不存在」的页面造占位页；布局键见文件末尾 layout.byPageType
  - source: ../plugins-local/virtual-node-pro
    enabled: true
  - source: github:quartz-community/explorer
    enabled: false
    layout:
      position: left
      priority: 50
  # 社区版 graph 已由本地 graph-pro 替代（d3/pixi 随插件本地打包，站点零外链）
  - source: github:quartz-community/graph
    enabled: false
    layout:
      position: right
      priority: 10
  - source: github:quartz-community/search
    enabled: false
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 30
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: github:quartz-community/tag-list
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      # 移出左侧工具栏，加入右上角按钮排（位置由 styles/custom.scss 里的 .darkmode 覆盖为 fixed）
      position: header
      priority: 5
  - source: github:quartz-community/reader-mode
    enabled: false
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: github:quartz-community/footer
    enabled: false
    options:
      links: {}
  - source: github:quartz-community/recent-notes
    enabled: false
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  # 社区版 note-properties 已由本地 note-properties-pro 替代
  # （frontmatter 值支持 HTML 锚点渲染 + 附件链接自动挂 download）
  - source: github:quartz-community/note-properties
    enabled: false
    options:
      # 显示全部 frontmatter 字段：生成数据的维度字段是 type / status / priority / 组织(项目/任务) 等，
      # 而 includeAll:false 时只会显示 includedProperties 里列的三项（description/tags/aliases），
      # 数据里没有这三项 → 属性块渲染为空白（表现为"frontmatter 没渲染出来"）。
      includeAll: true
      # 仅在 includeAll 切回 false 时生效；这里保留一份维度字段清单备用
      includedProperties:
        - description
        - tags
        - aliases
        - type
        - status
        - priority
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: ../plugins-local/note-properties-pro
    enabled: true
    options:
      includeAll: true
      includedProperties:
        - description
        - tags
        - aliases
        - type
        - status
        - priority
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
      # 新增能力（默认值即开启，显式写出便于调整）
      htmlInProperties: true
      downloadAttachments: true
      attachmentExtensions: []
      downloadNameFrom: alias
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: github:quartz-community/encrypted-pages
    enabled: false
    order: 900
    layout:
      position: body
      priority: 100
      display: all
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: ../plugins-local/reader-mode-pro
    enabled: true
    options: {}
    order: 50
    layout:
      position: header
      priority: 10
  - source: ../plugins-local/footer-pro
    enabled: true
    options:
      links: {}
      copyright: 源悦科技
    order: 50
  - source: ../plugins-local/content-index-pro
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
      rssLimit: 10
      rssFullHtml: false
      rssSlug: index
      includeEmptyFiles: true
    order: 50
  - source: ../plugins-local/search-pro
    enabled: true
    options:
      enablePreview: true
      fieldPriority:
        - title
        - content
        - tags
      initialDisplayCount: 10
      loadMoreCount: 10
    order: 50
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: ../plugins-local/explorer-pro
    enabled: true
    options:
      folderDefaultState: collapsed
      folderClickBehavior: link
      useSavedState: true
      virtualScrollWindowSize: 50
      hideFiles: false
      sort:
        type: natural
        order: asc
        field: title
    order: 50
    layout:
      position: left
      priority: 50
  # 本地 graph-pro（fork quartz-community/graph）：构建期预计算 + 提供图谱 UI（局部/全局）
  # 键名对齐 v4 settings/<domain>/quartz.{config,layout}.json 的 graph 段，将来 per-domain 注入无需改插件
  # d3@7 / pixi.js@8 已随插件打包（不再走 jsdelivr CDN，见 src/components/scripts/graph.inline.ts）
  - source: ../plugins-local/graph-pro
    enabled: true
    options:
      graph:
        precomputeLocal: true
        localDepth: 1
      localGraph:
        # 局部图谱：把当前页邻居按目录一级聚合成带数字徽标的节点，点击可展开
        aggregation:
          - type: folder
            depth: 1
        drag: true
        zoom: true
        depth: 1
        scale: 1.1
        # 以下数值对齐 v4 Graph.tsx 的 [TUNING]（间距调大，避免节点/长标题重叠与"边太短"）
        repelForce: 0.6
        centerForce: 0.3
        linkDistance: 70
        fontSize: 0.75
        opacityScale: 1
        showTags: true
        removeTags: []
        focusOnHover: false
        enableRadial: false
      globalGraph:
        enabled: true
        # 大区模式：按「项目类型」（frontmatter 的 type 字段）给核心节点分大区，首屏只显示大区节点
        # 项目类型取值：产品研发 / 基础设施建设 / 市场推广 / 运营支撑 / 技术预研（缺失 type 的归入 "(未分组)"）
        regionRules:
          - type: field
            field: type
        # 展开大区后核心节点保持收起（需再点具体节点才展开其邻域）
        expandCoresOnRegionOpen: false
        aggregation:
          - type: folder
            depth: 1
          - type: field
            field: type
          - type: date
            field: date
            granularity: year
        coreNodeFilter:
          - type: folder
            depth: 1
            values:
              - 项目
        coreNodeLimit: 50
        # 核心节点中心数字：关联数 ≥7 才显示，>120 显示为 120+
        countLabelMin: 7
        countLabelMaxDisplay: 120
        startCollapsed: true
        filterOrphans: true
        filterNonCoreNodes: true
        drag: true
        zoom: true
        depth: -1
        scale: 0.9
        # 以下数值对齐 v4 Graph.tsx 的 [TUNING]（全局图谱节点更分散，长标题不易重叠）
        repelForce: 1.5
        centerForce: 0.4
        linkDistance: 150
        fontSize: 0.72
        opacityScale: 1
        showTags: true
        removeTags: []
        focusOnHover: true
        enableRadial: true
    order: 55
    layout:
      position: right
      priority: 10
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
        - graph
        - backlinks
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
        - graph
        - backlinks
      positions:
        right: []
    canvas: {}
    bases: {}
    # 虚拟节点占位页：对齐 v4 的 virtualNodePageLayout ——
    # 右栏保留（局部图谱 + Backlinks + TOC），只排掉阅读模式按钮
    virtual-node:
      exclude:
        - reader-mode-pro
